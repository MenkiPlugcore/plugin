name: MENKIESTESParty Build

on:
  push:
    branches: [main]
    paths:
      - 'plugins/MENKIESTESParty/**'
      - '.github/workflows/menkiestesparty-build.yml'
  pull_request:
    paths:
      - 'plugins/MENKIESTESParty/**'
      - '.github/workflows/menkiestesparty-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-java21:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/MENKIESTESParty
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build + API/storage/admin contract tests
        run: gradle clean build --stacktrace

      - name: Verify production JAR
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' src/main/resources/plugin.yml | head -n1 | cut -d':' -f2- | tr -d " '\"\r")"
          test -n "$VERSION"
          JAR="build/libs/MENKIESTESParty-${VERSION}.jar"
          test -f "$JAR"
          test "$(find build/libs -maxdepth 1 -name '*.jar' | wc -l)" -eq 1
          test -f "RELEASE_NOTES_v${VERSION}.md"
          unzip -p "$JAR" plugin.yml | grep -q "^version: ${VERSION}$"
          jar tf "$JAR" | grep -q '^id/cadera/menkiestesparty/api/MenkiPartyAPI.class$'
          jar tf "$JAR" | grep -q '^id/cadera/menkiestesparty/AdministrationManager.class$'
          jar tf "$JAR" | grep -q '^id/cadera/menkiestesparty/AdministrationStabilityManager.class$'
          jar tf "$JAR" | grep -q '^id/cadera/menkiestesparty/AdminConfirmationGate.class$'
          jar tf "$JAR" | grep -q '^id/cadera/menkiestesparty/AdminArchiveIntegrity.class$'
          jar tf "$JAR" | grep -q '^id/cadera/menkiestesparty/storage/JdbcStorageBackend.class$'
          jar tf "$JAR" | grep -q '^id/cadera/menkiestesparty/storage/StorageIntegrity.class$'
          jar tf "$JAR" | grep -q '^org/sqlite/JDBC.class$'
          jar tf "$JAR" | grep -q '^com/mysql/cj/jdbc/Driver.class$'
          jar tf "$JAR" | grep -q '^administration.yml$'
          jar tf "$JAR" | grep -q '^messages.yml$'
          jar tf "$JAR" | grep -q '^storage.yml$'
          java -cp "$JAR" id.cadera.menkiestesparty.compat.RuntimeCompatibilityProbe
          sha256sum "$JAR"

      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: MENKIESTESParty-${{ github.sha }}
          path: plugins/MENKIESTESParty/build/libs/MENKIESTESParty-*.jar
          if-no-files-found: error

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: menkiestesparty_test
          MYSQL_USER: menkiparty
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: plugins/MENKIESTESParty
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: MySQL backend integration test
        env:
          MENKI_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/menkiestesparty_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          MENKI_TEST_MYSQL_USER: menkiparty
          MENKI_TEST_MYSQL_PASSWORD: testpass
        run: gradle test --tests '*StorageBackendContractTest.mysqlBackendRoundTripsAndUpsertsDocuments' --stacktrace

  runtime-java25:
    needs: [build-java21, mysql-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Download production candidate
        uses: actions/download-artifact@v4
        with:
          name: MENKIESTESParty-${{ github.sha }}
          path: artifact

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Java 25 runtime compatibility probe
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find artifact -maxdepth 1 -name 'MENKIESTESParty-*.jar' -print -quit)"
          test -n "$JAR"
          test -f "$JAR"
          java -cp "$JAR" id.cadera.menkiestesparty.compat.RuntimeCompatibilityProbe
          javap -verbose -classpath "$JAR" id.cadera.menkiestesparty.MENKIESTESPartyPlugin | grep -q 'major version: 65'

  publish-release:
    needs: [build-java21, mysql-integration, runtime-java25]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified production JAR
        uses: actions/download-artifact@v4
        with:
          name: MENKIESTESParty-${{ github.sha }}
          path: artifact

      - name: Publish or refresh GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(grep -E '^version:' plugins/MENKIESTESParty/src/main/resources/plugin.yml | head -n1 | cut -d':' -f2- | tr -d " '\"\r")"
          test -n "$VERSION"

          TAG="menkiestesparty-v${VERSION}"
          NOTES="plugins/MENKIESTESParty/RELEASE_NOTES_v${VERSION}.md"
          JAR="artifact/MENKIESTESParty-${VERSION}.jar"
          CHECKSUM="${JAR}.sha256"

          test -f "$NOTES"
          test -f "$JAR"
          unzip -p "$JAR" plugin.yml | grep -q "^version: ${VERSION}$"

          TITLE="$(head -n1 "$NOTES" | sed 's/^# //')"
          test -n "$TITLE"
          sha256sum "$JAR" > "$CHECKSUM"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file "$NOTES"
            gh release upload "$TAG" "$JAR" "$CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" "$JAR" "$CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --latest
          fi
