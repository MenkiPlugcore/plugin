name: MENKIESTESParty Build

on:
  push:
    branches: [main]
    paths:
      - 'plugins/MENKIESTESParty/**'
      - '.github/workflows/menkiestesparty-build.yml'
  pull_request:
    paths:
      - 'plugins/MENKIESTESParty/**'
      - '.github/workflows/menkiestesparty-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/MENKIESTESParty
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MENKIESTESParty-${{ github.sha }}
          path: plugins/MENKIESTESParty/build/libs/*.jar
          if-no-files-found: error
