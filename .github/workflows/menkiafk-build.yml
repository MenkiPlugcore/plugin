name: MENKIAFK Build

on:
  push:
    paths:
      - 'plugins/MENKIAFK/**'
      - '.github/workflows/menkiafk-build.yml'
  pull_request:
    paths:
      - 'plugins/MENKIAFK/**'
      - '.github/workflows/menkiafk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/MENKIAFK

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build MENKIAFK
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: MENKIAFK-${{ github.sha }}
          path: plugins/MENKIAFK/target/MENKIAFK-*.jar
          if-no-files-found: error
          retention-days: 14
