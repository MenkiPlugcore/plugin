name: MENKIAFK Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/MENKIAFK/**'
      - '.github/workflows/menkiafk-build.yml'
  pull_request:
    paths:
      - 'plugins/MENKIAFK/**'
      - '.github/workflows/menkiafk-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    name: Regression / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    defaults:
      run:
        working-directory: plugins/MENKIAFK

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run regression tests
        run: mvn --batch-mode --no-transfer-progress clean test

  build:
    name: Build / Verify / Release
    needs: regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/MENKIAFK

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build MENKIAFK
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Read release metadata
        shell: bash
        run: |
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          CHANNEL="$(mvn help:evaluate -Dexpression=menkiafk.release.channel -q -DforceStdout)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "TAG=menkiafk-v$VERSION" >> "$GITHUB_ENV"
          echo "JAR_LOCAL=target/MENKIAFK-$VERSION-Universal.jar" >> "$GITHUB_ENV"
          echo "JAR=plugins/MENKIAFK/target/MENKIAFK-$VERSION-Universal.jar" >> "$GITHUB_ENV"

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f "$JAR_LOCAL"

          case "$CHANNEL" in
            candidate|stable) ;;
            *) echo "Unsupported MENKIAFK release channel: $CHANNEL" >&2; exit 1 ;;
          esac

          PLUGIN_YML="$(unzip -p "$JAR_LOCAL" plugin.yml)"
          grep -Fq "name: MENKIAFK" <<< "$PLUGIN_YML"
          grep -Fq "version: '$VERSION'" <<< "$PLUGIN_YML"
          grep -Fq "api-version: '1.21.11'" <<< "$PLUGIN_YML"
          grep -Fq "main: store.menkiestes.menkiafk.MenkiAfkPlugin" <<< "$PLUGIN_YML"

          jar tf "$JAR_LOCAL" > target/jar-contents.txt
          for required in \
            store/menkiestes/menkiafk/api/MenkiAfkAPI.class \
            store/menkiestes/menkiafk/api/AfkSessionSnapshot.class \
            store/menkiestes/menkiafk/api/AfkStatisticsSnapshot.class \
            store/menkiestes/menkiafk/api/AfkSessionType.class \
            store/menkiestes/menkiafk/api/event/PlayerEnterAfkEvent.class \
            store/menkiestes/menkiafk/api/event/PlayerLeaveAfkEvent.class; do
            grep -Fxq "$required" target/jar-contents.txt || {
              echo "Missing required public API class: $required" >&2
              exit 1
            }
          done

          if grep -Eq '^(net/minecraft|org/bukkit/craftbukkit|org/bukkit/|me/clip/placeholderapi/)' target/jar-contents.txt; then
            echo "Provided server/plugin dependency was unexpectedly bundled into the release JAR." >&2
            exit 1
          fi

          javap -verbose -classpath "$JAR_LOCAL" store.menkiestes.menkiafk.MenkiAfkPlugin > target/javap-main.txt
          grep -Fq 'major version: 65' target/javap-main.txt

          jdeps --ignore-missing-deps -q "$JAR_LOCAL" > target/jdeps.txt
          if grep -Eq 'net\.minecraft|org\.bukkit\.craftbukkit' target/jdeps.txt; then
            echo "NMS/CraftBukkit dependency detected in release bytecode." >&2
            cat target/jdeps.txt
            exit 1
          fi

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: MENKIAFK-${{ env.VERSION }}-Universal
          path: ${{ env.JAR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping duplicate release."
            exit 0
          fi

          if [ "$CHANNEL" = "candidate" ]; then
            TITLE="MENKIAFK v$VERSION Universal — Production Candidate"
            CHANNEL_FLAGS=(--prerelease)
          else
            TITLE="MENKIAFK v$VERSION Universal"
            CHANNEL_FLAGS=(--latest)
          fi

          gh release create "$TAG" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file plugins/MENKIAFK/CHANGELOG.md \
            "${CHANNEL_FLAGS[@]}"
