name: Remove migrated MENKIESTESParty source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-mparty-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove migrated plugin source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf plugins/MENKIESTESParty

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MenkiPlugcore'
          git config user.email 'cfirmansyah327@gmail.com'
          git add -A plugins/MENKIESTESParty
          if git diff --cached --quiet; then
            echo 'MENKIESTESParty source is already absent.'
            exit 0
          fi
          git commit -m 'chore: remove MENKIESTESParty after standalone migration'
          git push origin HEAD:main
