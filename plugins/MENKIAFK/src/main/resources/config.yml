  no-permission: "{@prefix} &cKamu tidak punya izin untuk menggunakan fitur ini."
  reason-required: "{@prefix} &cMasukkan alasan AFK. &7Contoh: &f/afk makan dulu"
  reason-too-long: "{@prefix} &cAlasan AFK maksimal &f%max% &ckarakter."
  cooldown: "{@prefix} &eTunggu &f%seconds%s &esebelum AFK lagi."
  afk-broadcast: "{@prefix} &e%player% &7sekarang &6AFK &8— &7%reason%"
  auto-afk-broadcast: "{@prefix} &e%player% &7otomatis &6AFK &8— &7%reason%"
