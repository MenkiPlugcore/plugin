# ==========================================================
# MENKIAFK v1.2.0 Universal - MENKIESTES
# Paper 1.21.11 -> 26.2 | Spigot 1.21.11 | bytecode Java 21
# ==========================================================

prefix: "&8[&6AFK&8]"

# Manual AFK
manual-afk:
  max-reason-length: 80
  cooldown-seconds: 8
  # Paksa /afk MENKIAFK walau EssentialsX juga mendaftarkan /afk.
  override-command-conflict: true

# Auto AFK hanya mengecek player secara periodik.
# Tidak ada penulisan database pada movement/chat.
auto-afk:
  enabled: true
  timeout-seconds: 300
  check-interval-seconds: 20
  reason: "Tidak aktif selama %minutes% menit"
  ignored-worlds: []

# Aktivitas yang mengembalikan player dari AFK dan mereset idle timer.
return-on:
  move: true
  rotate: true
  chat: true
  command: true
  interact: true
  inventory-click: true
  death: true
  teleport: false

# Broadcast dibuat satu baris supaya tidak memenuhi chat.
broadcast:
  on-afk: true
  on-return: true

mention:
  enabled: true
  # Berapa banyak notifikasi AFK maksimal dari satu chat.
  max-notifications-per-message: 3

private-message:
  enabled: true
  # Plugin hanya memberi warning, command asli tetap diteruskan ke EssentialsX/plugin chat.
  command-aliases: ["msg", "tell", "w", "whisper", "pm", "m"]
  # Simpan sementara pesan yang dikirim saat target AFK dan tampilkan saat target kembali.
  # Hanya RAM, hilang saat logout/restart.
  remember-while-afk: true
  max-remembered: 10

# Statistik bersifat standalone. Tidak membutuhkan Vault, database eksternal,
# world khusus, crate plugin, atau plugin server lain.
stats:
  # Checkpoint stats.yml. Session aktif ikut dicatat ke checkpoint agar kehilangan data
  # saat crash dibatasi hingga interval autosave terakhir.
  autosave-seconds: 300
  # Jumlah baris per halaman /afktop. Nilai efektif dibatasi 3-20.
  leaderboard-page-size: 10
  # Data harian disimpan untuk statistik hari/minggu. Minimum efektif 14 hari.
  keep-daily-days: 35
  # "system" mengikuti timezone OS/server. Bisa diganti contoh: Asia/Jakarta.
  timezone: "system"

placeholder:
  active-text: "Aktif"
  afk-text: "AFK"
  no-reason-text: "-"
  manual-text: "Manual"
  auto-text: "Otomatis"

