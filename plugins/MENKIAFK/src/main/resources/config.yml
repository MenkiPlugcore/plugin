  player-not-found: "{@prefix} &cPlayer &f%player% &ctidak ditemukan."
  mention-warning: "&6⚠ &f%player% &esedang AFK &8— &7%reason% &8(&f%duration%&8)"
  pm-warning: "&6⚠ &f%player% &esedang AFK &8— &7%reason% &8(&f%duration%&8). &7Pesan tetap dikirim."
  inbox-header: "{@prefix} &eAda &f%count% &epesan yang dikirim saat kamu AFK:"
