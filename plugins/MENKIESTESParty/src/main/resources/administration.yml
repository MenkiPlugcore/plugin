# MENKIESTESParty v1.6.2 - Admin Recovery & Observability
# Staff tooling remains command/GUI driven; no continuous heavy admin scan.
administration:
  enabled: true

  # Lifetime of a staged dangerous action.
  confirmation-seconds: 30

  # v1.6.1+: dangerous actions use a per-staff one-time token. A wrong token
  # never consumes the action until max-attempts is reached.
  confirmation:
    require-token: true
    max-attempts: 3

  gui:
    enabled: true

  audit:
    # Stored inside interactions.yml under moderation.audit.
    max-entries: 500
    retention-days: 90

  freeze:
    # Freeze is reversible. The previous recruitment mode is restored on unfreeze.
    block-roster: true
    block-interactions: true
    block-progression-management: false
    force-recruitment-closed: true

  forcejoin:
    # Keep normal Party slot limits even for staff unless explicitly changed.
    allow-over-cap: false

  snapshots:
    # v1.6.1+ admin export/archive and pre-disband safety snapshots use unique
    # filenames, YAML content verification and a .sha256 sidecar.
    format: MENKIESTESParty-admin-snapshot-v1
    checksum: SHA-256

  # v1.6.2 recovery/observability commands execute only when requested.
  # Recovery is intentionally read-only; no snapshot is restored automatically.
  observability:
    enabled: true
    audit-page-size: 10
    failed-action-window-hours: 24
    snapshot-scan-limit: 200
    repair-dryrun-max-lines: 20
