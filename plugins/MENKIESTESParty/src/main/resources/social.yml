# MENKIESTESParty v1.7.0 - Social & Party Identity
# This file configures public-facing Party profiles. Persistent profile values
# stay inside parties.yml so no new storage backend/schema is required.

social:
  enabled: true
  edit-cooldown-millis: 750
  announce-achievement-unlock: true

  profile:
    default-visibility: PUBLIC
    description-max-length: 120
    tag-min-length: 2
    tag-max-length: 5
    tag-unique: true
    default-color: AQUA
    default-icon: PLAYER_HEAD
    allowed-colors:
      - AQUA
      - BLUE
      - DARK_AQUA
      - GREEN
      - DARK_GREEN
      - YELLOW
      - GOLD
      - RED
      - LIGHT_PURPLE
      - DARK_PURPLE
      - WHITE
      - GRAY
    allowed-icons:
      - PLAYER_HEAD
      - NETHER_STAR
      - DIAMOND
      - EMERALD
      - AMETHYST_SHARD
      - HEART_OF_THE_SEA
      - TOTEM_OF_UNDYING
      - BLAZE_POWDER
      - IRON_PICKAXE
      - WHEAT
      - SHIELD

  privacy:
    leaderboard-include-private: false

  member-activity:
    active-days: 7
    away-days: 30

  leaderboard:
    page-size: 10

  achievements:
    established:
      display-name: 'Established'
      description: 'Reach Party Level 2'
      type: level
      target: 2
    renowned:
      display-name: 'Renowned'
      description: 'Reach 1500 Party reputation'
      type: reputation
      target: 1500
    full_crew:
      display-name: 'Full Crew'
      description: 'Reach 5 members'
      type: members
      target: 5
    project_builder:
      display-name: 'Project Builder'
      description: 'Complete 1 Party Project'
      type: projects
      target: 1
    project_master:
      display-name: 'Project Master'
      description: 'Complete 10 Party Projects'
      type: projects
      target: 10
    veteran:
      display-name: 'Veteran'
      description: 'Party age reaches 30 days'
      type: age_days
      target: 30
    active_force:
      display-name: 'Active Force'
      description: 'Record 1000 weighted activity in the Dynamic Identity window'
      type: activity
      target: 1000
