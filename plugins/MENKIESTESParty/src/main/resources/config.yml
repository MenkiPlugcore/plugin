prefix: '&b&lPARTY &8»&r'

party:
  min-name-length: 3
  max-name-length: 16
  max-members: 20
  invite-expire-seconds: 60
  home-delay-seconds: 3

levels:
  1:
    reputation: 0
    slots: 5
  2:
    reputation: 250
    slots: 10
  3:
    reputation: 750
    slots: 12
  4:
    reputation: 1500
    slots: 15
  5:
    reputation: 3000
    slots: 20

# Weekly Quest lama tetap aktif untuk progres Party Relic.
quests:
  mining:
    goal: 500
    reputation: 100
  hunter:
    goal: 100
    reputation: 120
  farmer:
    goal: 300
    reputation: 80
  ignore-player-placed-mining: true
  placed-ore-memory-cap: 3000

weekly-reset:
  enabled: true
  day: MONDAY
  time: '12:00'

# Daily Mission adalah progress bersama seluruh anggota Party.
daily-missions:
  enabled: true
  mining:
    goal: 150
    party-xp: 40
  hunter:
    goal: 30
    party-xp: 50
  farmer:
    goal: 80
    party-xp: 35

# Relic sederhana: +1 progress untuk setiap Weekly Quest Party yang selesai.
relic:
  level-2-missions: 3
  level-3-missions: 9
  level-4-missions: 18
  level-5-missions: 30

war:
  score-world: world
  default-duration-minutes: 30
  default-target-points: 30
  prepare-minutes: 10
  kill-points: 1
  owner-kill-points: 2
  same-victim-cooldown-minutes: 5
  combat-logout-points: true
  combat-logout-window-seconds: 20
  min-participation-minutes: 5
  lock-membership-during-active: true
  claim-pvp-override: true
  party-xp: 250

season:
  enabled-default: true
  default-name: Season_1
  champion-reputation: 1000

# ---------------------------------------------------------------------------
# Modular feature switches.
# Core Party tetap aktif walaupun seluruh module di bawah dimatikan.
# ---------------------------------------------------------------------------
modules:
  projects: true
  skill-tree: true
  divisions: true
  identity: true
  contracts: true
  diplomacy: true
  applications: true

# Optional inventory interfaces. Commands tetap berfungsi jika GUI dimatikan.
gui:
  progression:
    enabled: true
    progress-bar-width: 20
    confirmations:
      project-cancel: true
      skill-unlock: true

  # v1.3.1 - GUI untuk Contracts, Diplomacy, Recruitment dan Applications.
  interaction:
    enabled: true
    progress-bar-width: 20
    contract-goals:
      - 50
      - 100
      - 250
      - 500
      - 1000
    confirmations:
      contract-create: true
      contract-response: true
      contract-cancel: true
      contract-abandon: true
      diplomacy-change: true
      application-submit: true
      application-decisions: true
      application-cancel: true

progression:
  projects:
    definitions:
      mining_expedition:
        display-name: 'Mining Expedition'
        type: mining
        goal: 2500
        party-xp: 300
      monster_hunt:
        display-name: 'Monster Hunt'
        type: hunter
        goal: 500
        party-xp: 350
      harvest_drive:
        display-name: 'Harvest Drive'
        type: farmer
        goal: 1500
        party-xp: 250

  skill-tree:
    points-per-level: 1
    nodes:
      combat_i:
        display-name: 'Combat I'
        branch: COMBAT
        min-level: 2
        requires: ''
        effects:
          hunter-progress-bonus-percent: 10
      combat_ii:
        display-name: 'Combat II'
        branch: COMBAT
        min-level: 4
        requires: combat_i
        effects:
          hunter-progress-bonus-percent: 20
      labor_i:
        display-name: 'Labor I'
        branch: LABOR
        min-level: 2
        requires: ''
        effects:
          resource-progress-bonus-percent: 10
      labor_ii:
        display-name: 'Labor II'
        branch: LABOR
        min-level: 4
        requires: labor_i
        effects:
          resource-progress-bonus-percent: 20
      command_i:
        display-name: 'Command I'
        branch: COMMAND
        min-level: 3
        requires: ''
        effects:
          project-xp-bonus-percent: 10
      command_ii:
        display-name: 'Command II'
        branch: COMMAND
        min-level: 5
        requires: command_i
        effects:
          project-xp-bonus-percent: 20

  divisions:
    allow-self-select: true
    types:
      combat:
        display-name: 'Combat Division'
        effects:
          hunter-progress-bonus-percent: 5
      resource:
        display-name: 'Resource Division'
        effects:
          resource-progress-bonus-percent: 5
      support:
        display-name: 'Support Division'
        effects:
          all-project-progress-bonus-percent: 3

  identity:
    window-days: 30
    min-activity: 50
    dominance-percent: 45.0
    project-completion-weight: 50
    announce-change: true
    labels:
      DEVELOPING: 'Developing'
      WARLIKE: 'Warlike'
      INDUSTRIAL: 'Industrial'
      AGRARIAN: 'Agrarian'
      PROJECT_FOCUSED: 'Project Focused'
      BALANCED: 'Balanced'

interaction:
  contracts:
    min-goal: 10
    max-goal: 10000
    max-open-per-party: 3
    max-active-per-party: 2
    proposal-expire-hours: 24
    active-expire-hours: 48
    pair-cooldown-minutes: 60
    history-retention-days: 30
    placed-block-memory-cap: 5000
    allow-rival-parties: false
    party-xp-reward: 0
    trust-on-complete: 5
    trust-on-fail: 2

  diplomacy:
    request-expire-hours: 24

  applications:
    default-recruitment-mode: APPLICATION
    expire-hours: 48
    max-active-per-player: 3
    max-note-length: 80

rank-permissions:
  enabled: true
  officer:
    - contracts.create
    - contracts.respond
    - diplomacy.manage
    - recruitment.manage
    - applications.manage
  member: []

# ---------------------------------------------------------------------------
# v1.3.2 - Interaction Stability & UX
# Queue dibatasi dan dipruning otomatis agar interactions.yml tetap ringan.
# ---------------------------------------------------------------------------
stability:
  enabled: true

  notifications:
    max-per-player: 30
    retention-days: 14
    join-summary: true

  activity:
    # Recent Activity adalah feed pendek, bukan Legacy/history permanen.
    max-per-party: 30
    retention-days: 7

  anti-spam:
    command-action-ms: 750

  integrity:
    # Hanya repair yang tidak ambigu: orphan player index/application/diplomacy.
    safe-repair-on-startup: true
    safe-repair-periodic: true

# ---------------------------------------------------------------------------
# v1.4.0 - Developer API & Integration
# API memakai immutable snapshots dan tidak mengekspos YAML internal.
# Semua reward default kosong/0 sehingga upgrade tidak mengubah balance.
# ---------------------------------------------------------------------------
developer:
  api:
    enabled: true

  events:
    enabled: true
    # Post-state event bridge. 20 ticks = 1 detik.
    scan-ticks: 20

  integrations:
    vault:
      # Tetap optional. Jika Vault/Economy tidak ada, core plugin tetap normal.
      enabled: true

  rewards:
    enabled: true

    party-level-up:
      vault-owner-money: 0
      commands: []

    project-complete:
      vault-owner-money: 0
      commands: []

    contract-complete:
      vault-owner-money: 0
      commands: []

    war-win:
      vault-owner-money: 0
      commands: []
