prefix: '&b&lPARTY &8»&r'

party:
  min-name-length: 3
  max-name-length: 16
  max-members: 20
  invite-expire-seconds: 60
  home-delay-seconds: 3

levels:
  1:
    reputation: 0
    slots: 5
  2:
    reputation: 250
    slots: 10
  3:
    reputation: 750
    slots: 12
  4:
    reputation: 1500
    slots: 15
  5:
    reputation: 3000
    slots: 20

# Weekly Quest lama tetap aktif untuk progres Party Relic.
quests:
  mining:
    goal: 500
    reputation: 100
  hunter:
    goal: 100
    reputation: 120
  farmer:
    goal: 300
    reputation: 80
  ignore-player-placed-mining: true
  placed-ore-memory-cap: 3000

weekly-reset:
  enabled: true
  day: MONDAY
  time: '12:00'

# Daily Mission adalah progress bersama seluruh anggota Party.
# Reset dilakukan otomatis saat tanggal server berganti.
daily-missions:
  enabled: true
  mining:
    goal: 150
    party-xp: 40
  hunter:
    goal: 30
    party-xp: 50
  farmer:
    goal: 80
    party-xp: 35

# Relic sederhana: +1 progress untuk setiap Weekly Quest Party yang selesai.
# Daily Mission tidak menambah Relic; reward-nya khusus Party XP.
relic:
  level-2-missions: 3
  level-3-missions: 9
  level-4-missions: 18
  level-5-missions: 30

war:
  score-world: world
  default-duration-minutes: 30
  default-target-points: 30
  prepare-minutes: 10
  kill-points: 1
  owner-kill-points: 2
  same-victim-cooldown-minutes: 5
  combat-logout-points: true
  combat-logout-window-seconds: 20
  min-participation-minutes: 5
  lock-membership-during-active: true
  claim-pvp-override: true

  # Satu-satunya reward otomatis Party War.
  # Secara internal memakai reputation sebagai Party XP/level progress.
  party-xp: 250

  # Tidak ada chest/item/reward otomatis.
  # Senjata/item pemenang diberikan manual oleh admin ke perwakilan team.

season:
  enabled-default: true
  default-name: Season_1
  champion-reputation: 1000
