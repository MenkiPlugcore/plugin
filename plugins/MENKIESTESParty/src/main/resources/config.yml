prefix: '&b&lPARTY &8»&r'

party:
  min-name-length: 3
  max-name-length: 16
  max-members: 20
  invite-expire-seconds: 60
  home-delay-seconds: 3

levels:
  1:
    reputation: 0
    slots: 5
  2:
    reputation: 250
    slots: 10
  3:
    reputation: 750
    slots: 12
  4:
    reputation: 1500
    slots: 15
  5:
    reputation: 3000
    slots: 20

# Weekly Quest lama tetap aktif untuk progres Party Relic.
quests:
  mining:
    goal: 500
    reputation: 100
  hunter:
    goal: 100
    reputation: 120
  farmer:
    goal: 300
    reputation: 80
  ignore-player-placed-mining: true
  placed-ore-memory-cap: 3000

weekly-reset:
  enabled: true
  day: MONDAY
  time: '12:00'

# Daily Mission adalah progress bersama seluruh anggota Party.
daily-missions:
  enabled: true
  mining:
    goal: 150
    party-xp: 40
  hunter:
    goal: 30
    party-xp: 50
  farmer:
    goal: 80
    party-xp: 35

# Relic sederhana: +1 progress untuk setiap Weekly Quest Party yang selesai.
relic:
  level-2-missions: 3
  level-3-missions: 9
  level-4-missions: 18
  level-5-missions: 30

war:
  score-world: world
  default-duration-minutes: 30
  default-target-points: 30
  prepare-minutes: 10
  kill-points: 1
  owner-kill-points: 2
  same-victim-cooldown-minutes: 5
  combat-logout-points: true
  combat-logout-window-seconds: 20
  min-participation-minutes: 5
  lock-membership-during-active: true
  claim-pvp-override: true
  party-xp: 250

season:
  enabled-default: true
  default-name: Season_1
  champion-reputation: 1000

# ---------------------------------------------------------------------------
# v1.2.x - Party Progression modules
# Set false untuk mematikan fitur tanpa mematikan core Party.
# ---------------------------------------------------------------------------
modules:
  projects: true
  skill-tree: true
  divisions: true
  identity: true

# v1.2.2 - Progression GUI safety & usability.
# Command tetap berfungsi jika GUI dimatikan.
gui:
  progression:
    enabled: true
    # Panjang visual progress bar di lore GUI. Range efektif 5-40.
    progress-bar-width: 20
    confirmations:
      # Mencegah cancel Project karena salah klik.
      project-cancel: true
      # Mencegah Skill Point terpakai karena salah klik.
      skill-unlock: true

progression:
  projects:
    definitions:
      mining_expedition:
        display-name: 'Mining Expedition'
        type: mining
        goal: 2500
        party-xp: 300
      monster_hunt:
        display-name: 'Monster Hunt'
        type: hunter
        goal: 500
        party-xp: 350
      harvest_drive:
        display-name: 'Harvest Drive'
        type: farmer
        goal: 1500
        party-xp: 250

  # Party mendapatkan 1 Skill Point setiap naik 1 level setelah Level 1.
  # Satu node = satu Skill Point. Node dapat dibuat/diubah lewat config.
  skill-tree:
    points-per-level: 1
    nodes:
      combat_i:
        display-name: 'Combat I'
        branch: COMBAT
        min-level: 2
        requires: ''
        effects:
          hunter-progress-bonus-percent: 10
      combat_ii:
        display-name: 'Combat II'
        branch: COMBAT
        min-level: 4
        requires: combat_i
        effects:
          hunter-progress-bonus-percent: 20
      labor_i:
        display-name: 'Labor I'
        branch: LABOR
        min-level: 2
        requires: ''
        effects:
          resource-progress-bonus-percent: 10
      labor_ii:
        display-name: 'Labor II'
        branch: LABOR
        min-level: 4
        requires: labor_i
        effects:
          resource-progress-bonus-percent: 20
      command_i:
        display-name: 'Command I'
        branch: COMMAND
        min-level: 3
        requires: ''
        effects:
          project-xp-bonus-percent: 10
      command_ii:
        display-name: 'Command II'
        branch: COMMAND
        min-level: 5
        requires: command_i
        effects:
          project-xp-bonus-percent: 20

  # Division bersifat optional dan tidak mengganti role Owner/Officer/Member.
  divisions:
    allow-self-select: true
    types:
      combat:
        display-name: 'Combat Division'
        effects:
          hunter-progress-bonus-percent: 5
      resource:
        display-name: 'Resource Division'
        effects:
          resource-progress-bonus-percent: 5
      support:
        display-name: 'Support Division'
        effects:
          all-project-progress-bonus-percent: 3

  # Identity tidak dapat dipilih manual. Aktivitas 30 hari terakhir membentuknya.
  identity:
    window-days: 30
    min-activity: 50
    dominance-percent: 45.0
    project-completion-weight: 50
    announce-change: true
    labels:
      DEVELOPING: 'Developing'
      WARLIKE: 'Warlike'
      INDUSTRIAL: 'Industrial'
      AGRARIAN: 'Agrarian'
      PROJECT_FOCUSED: 'Project Focused'
      BALANCED: 'Balanced'
