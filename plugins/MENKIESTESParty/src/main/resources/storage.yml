# MENKIESTESParty v1.5.1 - Storage Stability & Migration Hardening
# YAML remains the production-safe default. SQLite/MySQL are optional.
storage:
  backend: YAML # YAML | SQLITE | MYSQL

  # Normal dirty-state saves are serialized on the server/global thread, then
  # queued/coalesced to one dedicated storage worker.
  async-writes: true
  shutdown-flush-timeout-seconds: 10

  # If SQL cannot initialize or later becomes unhealthy, current data is
  # persisted to YAML. v1.5.1 can automatically resync and return to SQL.
  fallback-to-yaml-on-error: true
  mirror-yaml-backup: true

  migration:
    # Legacy first-boot compatibility from v1.5.0.
    import-yaml-when-sql-empty: true
    import-missing-yaml-documents: true

    # `/partystorage migrate <backend>` refuses to overwrite a non-empty target
    # whose checksum differs. `force` must be explicitly supplied to override.
    require-empty-or-matching-target: true

  backups:
    # Manual, migration, import and crash-recovery snapshots share this rotation.
    max-count: 12

  queue:
    # Warn if the newest coalesced snapshot has waited this long.
    warn-after-millis: 5000

  health-check:
    interval-seconds: 30
    failures-before-fallback: 2
    auto-recover-sql: true

  recovery:
    # If the previous session did not write a clean-shutdown marker, preserve
    # the successfully loaded backend state before normal gameplay continues.
    backup-after-unclean-shutdown: true

  sql:
    table: menkiestesparty_storage
    retry:
      max-attempts: 2
      delay-millis: 250

  sqlite:
    file: storage.db

  mysql:
    host: 127.0.0.1
    port: 3306
    database: menkiestesparty
    username: root
    password: ''
    parameters: 'useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=5000&socketTimeout=10000'

compatibility:
  folia:
    # Scheduler boundary exists, but full region-thread safety is still not
    # certified. Keep false on production Folia servers.
    experimental: false
