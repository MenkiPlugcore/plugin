name: MENKIESTESParty
version: 1.2.2
main: id.cadera.menkiestesparty.MENKIESTESPartyPlugin
api-version: '1.21'
author: CADERA
description: Modular Paper Party system with missions, projects, skill tree, divisions, dynamic identity, progression GUI and Party War.
softdepend: [PlaceholderAPI, GriefPrevention]
commands:
  party:
    aliases: [p, parties]
    description: Main Party command
    usage: /party
  pchat:
    aliases: [pc, partychat]
    description: Party chat
    usage: /pchat <message>
  partywar:
    description: Party War command
    usage: /partywar
  partyseason:
    description: Party Season command
    usage: /partyseason
  partydaily:
    aliases: [pdaily]
    description: Daily Party Mission
    usage: /partydaily
  partyproject:
    aliases: [pproject]
    description: Party Project command
    usage: /partyproject
  partyskill:
    aliases: [pskill]
    description: Party Skill Tree command
    usage: /partyskill
  partydivision:
    aliases: [pdivision]
    description: Party Division command
    usage: /partydivision
  partyidentity:
    aliases: [pidentity]
    description: Dynamic Party Identity
    usage: /partyidentity
  partyprofile:
    aliases: [pprofile]
    description: Party progression profile
    usage: /partyprofile
permissions:
  menkiestesparty.admin:
    description: Full MENKIESTESParty administration
    default: op
  menkiestesparty.gui.progression:
    description: Open the Party Progression GUI
    default: true
  menkiestesparty.gui.projects:
    description: View Party Projects GUI
    default: true
  menkiestesparty.gui.projects.manage:
    description: Start and cancel Party Projects from GUI; Party role rules still apply
    default: true
  menkiestesparty.gui.skills:
    description: View Party Skill Tree GUI
    default: true
  menkiestesparty.gui.skills.unlock:
    description: Unlock Party Skills from GUI; Owner rule still applies
    default: true
  menkiestesparty.gui.divisions:
    description: View Party Divisions GUI
    default: true
  menkiestesparty.gui.divisions.self:
    description: Self-select a Party Division from GUI when enabled in config
    default: true
  menkiestesparty.gui.divisions.manage:
    description: Manage member Divisions from GUI; Party role rules still apply
    default: true
  menkiestesparty.gui.identity:
    description: View Dynamic Party Identity GUI
    default: true
