name: MENKIESTESParty
version: 1.2.0
main: id.cadera.menkiestesparty.MENKIESTESPartyPlugin
api-version: '1.21'
author: CADERA
description: Modular Paper Party system with missions, projects, skill tree, divisions, dynamic identity and Party War.
softdepend: [PlaceholderAPI, GriefPrevention]
commands:
  party:
    aliases: [p, parties]
    description: Main Party command
    usage: /party
  pchat:
    aliases: [pc, partychat]
    description: Party chat
    usage: /pchat <message>
  partywar:
    description: Party War command
    usage: /partywar
  partyseason:
    description: Party Season command
    usage: /partyseason
  partydaily:
    aliases: [pdaily]
    description: Daily Party Mission
    usage: /partydaily
  partyproject:
    aliases: [pproject]
    description: Party Project command
    usage: /partyproject
  partyskill:
    aliases: [pskill]
    description: Party Skill Tree command
    usage: /partyskill
  partydivision:
    aliases: [pdivision]
    description: Party Division command
    usage: /partydivision
  partyidentity:
    aliases: [pidentity]
    description: Dynamic Party Identity
    usage: /partyidentity
  partyprofile:
    aliases: [pprofile]
    description: Party progression profile
    usage: /partyprofile
permissions:
  menkiestesparty.admin:
    description: Full MENKIESTESParty administration
    default: op
