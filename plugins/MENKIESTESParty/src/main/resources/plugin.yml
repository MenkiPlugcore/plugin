name: MENKIESTESParty
version: 1.1.0
main: id.cadera.menkiestesparty.MENKIESTESPartyPlugin
api-version: '1.21'
author: CADERA
description: Native Paper Party system with weekly quests, daily missions, relic progression, open-world Party War and manual admin rewards.
softdepend: [PlaceholderAPI, GriefPrevention]
commands:
  party:
    aliases: [p, parties]
    description: Main Party command
    usage: /party
  pchat:
    aliases: [pc, partychat]
    description: Party chat
    usage: /pchat <message>
  partywar:
    description: Party War command
    usage: /partywar
  partyseason:
    description: Party Season command
    usage: /partyseason
  partydaily:
    aliases: [pdaily]
    description: Daily Party Mission
    usage: /partydaily
permissions:
  menkiestesparty.admin:
    description: Full MENKIESTESParty administration
    default: op
