# MENKIESTESParty v2.0.0 - Major Architecture Release
# This file contains architecture/runtime settings only. Gameplay balance stays
# in config.yml, storage connection settings stay in storage.yml.
architecture:
  api-v2:
    # Additive service. MenkiPartyAPI v1.0 remains registered for old plugins.
    enabled: true

  storage:
    document-schema:
      # v2 adds reserved metadata fields to the existing five YAML documents.
      # The SQL table/backend protocol itself remains unchanged.
      auto-migrate: true
      block-legacy-startup: true

  network:
    # v2.0.0 intentionally ships LOCAL only. LOCAL performs no network I/O.
    # Future distributed transports can use the v2 revision-envelope contract.
    mode: LOCAL

    # 'auto' becomes a stable generated node-xxxxxxxxxxxx value on first start.
    node-id: auto

    # If someone configures a transport not bundled by this version, default
    # behavior is to warn and remain LOCAL instead of disabling the Party core.
    fail-on-unsupported-mode: false

    # Revision envelopes are emitted from existing post-state Party events.
    # No extra polling scheduler is introduced.
    publish-event-envelopes: true

    # Stores one monotonic revision counter per Party plus one last-envelope
    # summary in interactions.yml. No unbounded event history is stored.
    persist-revisions: true
